function locationSpecificFocus(p){
 const name=p.name||'이 장소', traits=visualFeaturesFor(p), concepts=(p.bestConcepts||[]).filter(x=>!GENERIC_VISUAL_TAGS.has(x)), hay=[name,p.category,p.summary,...(p.visualStrengths||[]),...(p.moodTags||[]),...(p.searchTerms||[])].join(' '), plan=p.shootingPlan||{};
 const first=traits[0]||p.category||'공간 구조', second=traits[1]||p.region||'주변 환경', third=traits[2]||concepts[0]||'세부 질감', concept=concepts[0]||p.moodTags?.[0]||p.category||'공간 중심 촬영';
 if(/DDP|동대문디자인플라자|유선형|곡선형|메탈 패널|조형건축/.test(hay))return `${name}은 곡선 외피와 금속 표면이 시점에 따라 다른 윤곽을 만들기 때문에, 건물 전체를 한 번에 설명하기보다 곡선이 겹치는 경계와 인물의 크기 대비를 나눠 촬영하는 편이 효과적입니다. 흐린 날에는 표면의 균일한 톤을, 해가 낮을 때는 곡면 위 반사와 긴 그림자를 비교하세요.`;

 if(/산업|공장|창고|벙커|철도|항만|콘크리트|탱크|기지|폐시설/.test(hay))return `${name}의 사진적 강점은 큰 구조와 표면의 마모, 반복되는 선이 함께 만드는 산업적 리듬입니다. 먼저 구조의 반복이 이어지는 축을 찾아 와이드 컷을 만들고, 그 다음 녹·콘크리트·금속의 표면을 압축한 디테일과 인물 실루엣을 별도로 촬영하세요. 출입이 제한된 구역을 배경으로 쓰지 않도록 실제 개방 범위도 함께 확인해야 합니다.`;
 if(/바다|항구|포구|해변|수변|호수|전망대|등대|강변|습지|염전/.test(hay))return `${name}은 수평선이나 물의 반사만으로는 평면적으로 보일 수 있어 전경을 반드시 설계해야 합니다. 바위·난간·갈대·데크 중 하나를 프레임 앞쪽에 두고, 물결과 배경의 층을 분리한 와이드 컷을 확보하세요. 인물 컷은 역광 실루엣과 측광 디테일을 따로 찍고 바람·조수·구름 변화도 촬영 변수로 기록합니다.`;

 if(next&&now-started<IMAGE_RETRY_TOTAL_MS){img.dataset.fallbackUrls=JSON.stringify(candidates.filter(u=>u!==next));img.src=next;scoutImageWatch(img);return;}

function wireHome(){document.getElementById('recentPrev')?.addEventListener('click',()=>{recentPage=Math.max(0,recentPage-1);renderHome();document.getElementById('recentPrev')?.focus();});document.getElementById('recentNext')?.addEventListener('click',()=>{recentPage=Math.min(Math.max(0,Math.ceil(recentPlaces().length/RECENT_PAGE_SIZE)-1),recentPage+1);renderHome();document.getElementById('recentNext')?.focus();});const q=document.getElementById('placeSearch');q?.addEventListener('input',()=>{query=q.value;const pos=window.scrollY;renderHome();const el=document.getElementById('placeSearch');el?.focus();el?.setSelectionRange(el.value.length,el.value.length);window.scrollTo(0,pos);});document.getElementById('regionSelect')?.addEventListener('change',e=>{regionFilter=e.target.value;renderHome();});document.getElementById('spaceSelect')?.addEventListener('change',e=>{spaceFilter=e.target.value;renderHome();});document.getElementById('moodSelect')?.addEventListener('change',e=>{moodFilter=e.target.value;renderHome();});document.querySelectorAll('[data-region]').forEach(b=>b.addEventListener('click',()=>{regionFilter=b.dataset.region;renderHome();}));document.querySelectorAll('[data-image-filter]').forEach(b=>b.addEventListener('click',()=>{imageFilter=imageFilter===b.dataset.imageFilter?'전체':b.dataset.imageFilter;renderHome();}));document.getElementById('clearFilters')?.addEventListener('click',resetFilters);document.getElementById('emptyReset')?.addEventListener('click',resetFilters);document.getElementById('startExplore')?.addEventListener('click',()=>{document.getElementById('searchPanel')?.scrollIntoView({behavior:'smooth'});setTimeout(()=>document.getElementById('placeSearch')?.focus(),300);});document.getElementById('heroMap')?.addEventListener('click',()=>renderMap());document.getElementById('heroPhotoSearch')?.addEventListener('click',()=>{const hp=heroPlace();if(hp)openExternal(imageSearchLinks(hp).naver);});}

function editorialSearchUrl(engine,title){const q=encodeURIComponent(`${title||'fashion editorial'} fashion editorial reference location`);if(engine==='naver')return `https://search.naver.com/search.naver?where=image&query=${q}`;if(engine==='bing')return `https://www.bing.com/images/search?q=${q}`;return `https://www.google.com/search?tbm=isch&q=${q}`;}

function classifyEditorialCategories(p){const defs=window.FRAME_ATLAS_EDITORIAL_CATEGORIES||[];if(Array.isArray(p.editorialCategoryIds)&&p.editorialCategoryIds.length)return p.editorialCategoryIds;const core=(String(p.name||'')+' '+String(p.category||'')).toLowerCase();const visual=[...(p.moodTags||[]),...(p.visualStrengths||[]),...(p.bestConcepts||[])].join(' ').toLowerCase();const desc=[p.summary,p.photoProfile,p.notes,p.editorialVisualFocus,...(p.searchTerms||[])].filter(Boolean).join(' ').toLowerCase();const ranked=defs.map(c=>{let score=0;for(const kw of (c.keywords||[])){const k=String(kw).toLowerCase();if(!k)continue;if(core.includes(k))score+=4;else if(visual.includes(k))score+=2;else if(desc.includes(k))score+=1;}return {id:c.id,score};}).sort((a,b)=>b.score-a.score);if(!ranked.length||ranked[0].score<1)return ['urban-street'];const out=[ranked[0].id];for(const x of ranked.slice(1)){if(out.length>=3)break;if(x.score>=3&&x.score>=ranked[0].score*.38)out.push(x.id);}return out;}

<section class="panel" id="shootPlanPanel"><div class="panel-kicker">03 / SHOOT PLAN</div><h2>촬영 사전 기획</h2><p>장소를 고른 이유만 기록하지 말고, 실제로 어떤 장면을 찍을지 미리 설계합니다. 미정인 항목은 비워 두고 답사 후 갱신해도 됩니다.</p><details class="shoot-plan-details" open><summary>촬영 계획 작성 / 접기</summary><div class="shoot-plan-controls"><button class="btn btn-outline btn-sm" type="button" id="applyShootSuggestions">이 장소의 촬영 제안 적용</button></div><div class="form-grid" style="margin-top:10px"><div class="field"><label for="shootGoal">촬영 목적·장르</label><input class="input" id="shootGoal" value="${escapeHtml(fieldPlan.goal||'')}" placeholder="촬영 목적을 직접 입력"><small class="shoot-plan-suggestion">제안 · ${escapeHtml(shootSuggestions.goal)}</small></div><div class="field"><label for="shootMood">핵심 분위기·이야기</label><input class="input" id="shootMood" value="${escapeHtml(fieldPlan.mood||'')}" placeholder="핵심 분위기를 직접 입력"><small class="shoot-plan-suggestion">제안 · ${escapeHtml(shootSuggestions.mood)}</small></div><div class="field full"><label for="shootLight">시간대·빛 방향</label><input class="input" id="shootLight" value="${escapeHtml(fieldPlan.light||'')}" placeholder="시간대와 빛 방향을 직접 입력"><small class="shoot-plan-suggestion">제안 · ${escapeHtml(shootSuggestions.light)}</small></div><div class="field full"><label for="shootShots">필수 컷 리스트</label><textarea class="textarea" id="shootShots" placeholder="필수 컷을 직접 작성">${escapeHtml(fieldPlan.shots||'')}</textarea><small class="shoot-plan-suggestion">제안<br>${escapeHtml(shootSuggestions.shots).replace(/\n/g,'<br>')}</small></div><div class="field full"><label for="shootGear">렌즈·장비·카메라 위치</label><textarea class="textarea" id="shootGear" placeholder="렌즈·장비·카메라 위치를 직접 작성">${escapeHtml(fieldPlan.gear||'')}</textarea><small class="shoot-plan-suggestion">제안 · ${escapeHtml(shootSuggestions.gear)}</small></div><div class="field full"><label for="shootStaging">인물·의상·소품·배경 통제</label><textarea class="textarea" id="shootStaging" placeholder="인물·의상·소품·배경 통제를 직접 작성">${escapeHtml(fieldPlan.staging||'')}</textarea><small class="shoot-plan-suggestion">제안 · ${escapeHtml(shootSuggestions.staging)}</small></div><div class="field full"><label for="shootPlanB">변수와 대체 계획</label><textarea class="textarea" id="shootPlanB" placeholder="변수와 대체 계획을 직접 작성">${escapeHtml(fieldPlan.planB||'')}</textarea><small class="shoot-plan-suggestion">제안 · ${escapeHtml(shootSuggestions.planB)}</small></div></div><div class="memo-actions"><button class="btn btn-primary" id="saveShootPlan">촬영 계획 저장</button><span class="save-hint">이 기기에 저장되며 개인 기록 백업에 포함됩니다.</span></div></details></section>
<section class="panel" id="photoGallery"><div class="panel-kicker">04 / PHOTO REFERENCES</div><h2>대표·참고 사진 후보 <span class="candidate-count">${gallery.length}장 등록</span></h2><div class="candidate-place-context"><b>현재 장소</b> ${escapeHtml(p.name)} <span>· ${escapeHtml(p.regionDetail||p.region||'지역 미확인')} · ${escapeHtml(p.id)}</span></div><p>${escapeHtml(photoNote)}</p>${gallery.length===1?`<div class="cover-replacement-help"><strong>현재 후보 사진은 1장입니다.</strong> 이 사진을 지우지 않고 새 후보를 추가해 교체할 수 있습니다. 위의 이미지 검색에서 다른 사진을 찾은 뒤, 아래에 새 이미지 주소를 등록하고 새 카드의 <b>대표사진으로 사용</b>을 누르세요.</div>`:gallery.length===0?`<div class="cover-replacement-help"><strong>아직 등록된 사진 후보가 없습니다.</strong> 이미지 검색에서 장소에 맞는 사진을 찾아 아래에 주소를 등록하면 첫 대표사진으로 지정할 수 있습니다.</div>`:''}<div class="search-links"><button class="btn btn-primary btn-sm" data-imgsearch="naver">네이버 이미지</button><button class="btn btn-outline btn-sm" data-imgsearch="google">Google 이미지</button><button class="btn btn-outline btn-sm" data-imgsearch="bing">Bing 이미지</button>${p.officialUrl?`<a class="btn btn-outline btn-sm" href="${escapeHtml(safeUrl(p.officialUrl))}" target="_blank" rel="noopener">공식 출처 ↗</a>`:''}</div><div class="cover-add-box"><p><b>대표사진 교체 방법</b> 후보가 한 장뿐이어도 교체할 수 있습니다. 위의 Google·네이버·Bing 이미지 검색에서 새 사진을 열고 이미지 주소를 복사해 등록하세요. 새 후보가 아래에 나타나면 <b>대표사진으로 사용</b>을 누릅니다. 새 후보를 등록하는 것만으로는 기존 대표사진이 바뀌거나 삭제되지 않습니다.</p><div class="cover-add-grid"><div class="field full"><label for="candidateImageTitle">사진 이름(간단히)</label><input class="input" id="candidateImageTitle" placeholder="예: 북측 외관의 사선 구도"></div><div class="field full"><label for="candidateImageUrl">이미지 주소(URL)</label><input class="input" id="candidateImageUrl" placeholder="이미지 주소 복사 후 여기에 붙여넣기"></div><div class="field full"><label for="candidateSourceUrl">원문 페이지 주소(URL)</label><input class="input" id="candidateSourceUrl" placeholder="선택 사항 · 이미지가 게시된 원문 페이지"></div></div><div class="button-row"><button class="btn btn-primary btn-sm" id="addImageCandidate">사진 후보 등록</button><span class="save-hint">현재 브라우저에만 저장됩니다.</span></div></div>${gallery.length?`<div class="gallery-grid" style="margin-top:16px">${gallery.map((im,i)=>`<div class="gallery-item"><div class="gallery-img">${im.src?`<img loading="lazy" referrerpolicy="origin" src="${escapeHtml(im.src)}" data-fallback-mode="gallery" data-fallback-urls="${imageUrlData(p,im.src)}" alt="${escapeHtml(im.title)} · ${escapeHtml(p.name)} 사진 후보" onload="scoutImageLoaded(this)" onerror="scoutImageError(this)"><div class="gallery-img-fallback" style="display:none"><strong>사진 미리보기를 열 수 없습니다.</strong><span>원문 출처 또는 이미지 검색으로 확인하세요.</span></div>`:`<div class="gallery-img-fallback"><strong>사진 주소 없음</strong><span>장소명으로 이미지를 찾아보세요.</span></div>`}</div><div class="gallery-caption"><strong>${escapeHtml(im.title)}</strong><small class="gallery-place-context">${escapeHtml(p.name)} · ${escapeHtml(p.regionDetail||p.region||'지역 미확인')} · ${escapeHtml(p.id)}</small><p>${escapeHtml(im.sourceName||'출처 미상')} · ${im.placeMatch==='confirmed'?'장소 일치 후보':'장소 일치 확인 필요'}</p><details class="image-source-details"><summary>출처·참고 메모</summary><p>출처: ${escapeHtml(im.sourceName||'출처 미상')}</p><p>${escapeHtml(im.note||im.caption||'촬영 참고 이미지입니다. 장소와 현재 공간의 일치 여부를 확인해 주세요.')}</p></details>${im.sourcePageUrl?`<a href="${escapeHtml(safeUrl(im.sourcePageUrl))}" target="_blank" rel="noopener">원문 출처 열기 ↗</a>`:''}<button type="button" class="cover-select-btn ${coverFor(p)===im.src?'is-cover':''}" data-select-cover="${escapeHtml(im.src)}" data-cover-title="${escapeHtml(im.title||'참고 사진')}" data-cover-source="${escapeHtml(im.sourcePageUrl||'') }" ${coverFor(p)===im.src?'disabled':''}>${coverFor(p)===im.src?'현재 대표사진':'대표사진으로 사용'}</button></div></div>`).join('')}</div>`:`<div class="empty-state" style="margin-top:14px"><h3>등록된 사진 후보가 없습니다.</h3><p>위의 이미지 검색으로 장소 사진을 확인한 뒤, 아래 입력란에 이미지 주소를 등록하면 됩니다. 새 후보를 등록한 다음 대표사진으로 지정할 수 있습니다.</p></div>`}</section>
<section class="panel photo-review-panel"><div class="panel-kicker">05 / PHOTOGRAPHER IMAGE REVIEW</div><h2>대표사진의 예술적 가치 검토</h2>
<p>장소의 사진적 잠재력과 개별 사진의 완성도는 다릅니다. 실제 장소와 일치하는지, 선·형태·빛·재료가 잘 드러나는지, 대표 이미지로 쓸 만큼 공간이 식별되는지 별도로 평가합니다.</p>
${photoReview?`<div class="review-summary"><div class="review-score"><strong>${photoReview.artisticValue}/5</strong><span>이미지 예술적 가치</span></div><div class="review-score"><strong>${photoReview.composition}/5</strong><span>구도·공간 구조</span></div><div class="review-score"><strong>${photoReview.lightMaterial}/5</strong><span>빛·재료·색감</span></div><div class="review-score"><strong>${photoReview.shootingUse}/5</strong><span>촬영 활용도</span></div></div><div class="notice review-note"><b>${photoReview.status==='hold_identity_check'?'대표 승격 보류':photoReview.artisticValue>=4?'대표사진 후보로 검토':'보조 참고사진 후보'}</b><br>${escapeHtml(photoReview.reason)}<br><small>${escapeHtml(photoReview.caution||'출처 페이지와 현재 공간 상태를 필요시 재확인하세요.')}</small></div>`:`<div class="notice">이 장소의 대표사진은 아직 전문가 기준으로 개별 평가되지 않았습니다. 빈칸을 임의로 채우거나 다른 장소 사진으로 대체하지 않습니다.</div>`}
<div class="review-form"><h3>현장 검토 결과 기록</h3><div class="form-grid"><div class="field"><label>장소 일치</label><select class="select" id="reviewMatch"><option ${savedReview.match==='미확인'?'selected':''}>미확인</option><option ${savedReview.match==='일치 확인'?'selected':''}>일치 확인</option><option ${savedReview.match==='불일치'?'selected':''}>불일치</option></select></div><div class="field"><label>대표사진 판단</label><select class="select" id="reviewDecision"><option ${savedReview.decision==='검토 대기'?'selected':''}>검토 대기</option><option ${savedReview.decision==='대표 후보'?'selected':''}>대표 후보</option><option ${savedReview.decision==='보조 참고'?'selected':''}>보조 참고</option><option ${savedReview.decision==='교체 필요'?'selected':''}>교체 필요</option></select></div><div class="field"><label>구도·형태 (1–5)</label><select class="select" id="reviewComposition">${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(savedReview.composition||0)===n?'selected':''}>${n} / 5</option>`).join('')}</select></div><div class="field"><label>빛·재료·색감 (1–5)</label><select class="select" id="reviewLight">${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(savedReview.light||0)===n?'selected':''}>${n} / 5</option>`).join('')}</select></div><div class="field"><label>촬영 활용도 (1–5)</label><select class="select" id="reviewUse">${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(savedReview.use||0)===n?'selected':''}>${n} / 5</option>`).join('')}</select></div><div class="field full"><label>검토 메모</label><textarea class="textarea" id="reviewMemo" placeholder="예: 간판이 잘려 장소 식별이 어렵다. 사광 시간대 외관 컷으로 교체 필요.">${escapeHtml(savedReview.memo||'')}</textarea></div></div><div class="memo-actions"><button class="btn btn-primary" id="saveImageReview">사진 검토 기록 저장</button><span class="save-hint">이 기기에 저장되며 JSON 백업에 포함됩니다.</span></div></div>
</section>
<section class="panel"><div class="panel-kicker">06 / FIELD CHECKLIST</div><h2>현장 촬영 체크리스트</h2><p>확인하지 않은 항목은 비워 두고, 현장 답사나 담당자 답변 후 기록하세요.</p><div id="checklistArea">${CHECKLIST_GROUPS.map((g,gi)=>`<div class="checklist-group"><h3><span class="tag">${String(gi+1).padStart(2,'0')}</span>${g.name}</h3>${g.items.map((it,i)=>{const key=`g${gi}i${i}`;const checked=!!(state.checklists[p.id]&&state.checklists[p.id][key]&&state.checklists[p.id][key].checked);const val=(state.checklists[p.id]&&state.checklists[p.id][key]&&state.checklists[p.id][key].note)||'';return `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><label class="check-row"><input type="checkbox" data-check-key="${key}" ${checked?'checked':''}> <span>${escapeHtml(it)}</span></label><input class="input" style="min-height:36px;margin-left:24px;width:calc(100% - 24px);font-size:11px" data-check-note="${key}" value="${escapeHtml(val)}" placeholder="확인 내용·담당자 답변·재확인 날짜"></div>`}).join('')}</div>`).join('')}</div><div class="memo-actions"><button class="btn btn-primary" id="saveChecklist">현장 체크리스트 저장</button><span class="save-hint">이 기기에 저장됩니다. 다른 기기와 자동 공유되지 않습니다.</span></div></section>
<section class="panel"><div class="panel-kicker">07 / PERSONAL NOTES</div><h2>개인 촬영 메모</h2><p>현장에서 느낀 빛·배경·동선·인물 배치와 다음 방문 시 확인할 내용을 기록하세요.</p><textarea class="textarea" id="personalNote" placeholder="예: 오후 4시 역광, 35mm로 구조를 넓게 담고 인물은 입구 오른편에 배치...">${escapeHtml(notes)}</textarea><div class="memo-actions"><button class="btn btn-primary" id="saveNote">메모 저장</button><span class="save-hint">개인 메모는 현재 브라우저 안에만 저장됩니다.</span></div></section>
</div><aside class="detail-side">
<section class="panel"><div class="panel-kicker">LOCATION / INFORMATION</div><h2>장소 이용 정보</h2><div class="info-list">${fields.map(([label,val])=>`<div class="info-label">${label}</div><div class="info-value">${escapeHtml(val||'미확인')}</div>`).join('')}<div class="info-label">공식 홈페이지</div><div class="info-value">${p.officialUrl?`<a href="${escapeHtml(safeUrl(p.officialUrl))}" target="_blank" rel="noopener">공식 정보 확인 ↗</a>`:'등록된 주소 없음'}</div></div><p style="font-size:10px">일반 관람과 상업촬영·조명 장비 사용 허가는 별개입니다. 촬영 전에 담당 기관의 최신 안내를 확인하세요.</p></section>

 document.getElementById('backToList')?.addEventListener('click',goBack);document.getElementById('floatingBack')?.addEventListener('click',goBack);document.getElementById('detailFav')?.addEventListener('click',()=>toggleFavorite(p.id));document.getElementById('detailImages')?.addEventListener('click',()=>document.getElementById('photoGallery')?.scrollIntoView({behavior:'smooth'}));document.getElementById('detailMap')?.addEventListener('click',()=>openExternal(maps.naver));document.querySelectorAll('[data-imgsearch]').forEach(b=>b.addEventListener('click',()=>openExternal(images[b.dataset.imgsearch])));document.querySelectorAll('[data-select-cover]').forEach(b=>b.addEventListener('click',()=>selectRepresentativePhoto(p.id,b.dataset.selectCover,b.dataset.coverTitle,b.dataset.coverSource)));document.getElementById('addImageCandidate')?.addEventListener('click',()=>addImageCandidate(p.id));document.getElementById('applyShootSuggestions')?.addEventListener('click',()=>{const fields={shootGoal:shootSuggestions.goal,shootMood:shootSuggestions.mood,shootLight:shootSuggestions.light,shootShots:shootSuggestions.shots,shootGear:shootSuggestions.gear,shootStaging:shootSuggestions.staging,shootPlanB:shootSuggestions.planB};let filled=0;for(const [id,val] of Object.entries(fields)){const el=document.getElementById(id);if(el&&!el.value.trim()){el.value=val;filled++;}}toast(filled?`비어 있던 ${filled}개 항목에 이 장소의 촬영 제안을 넣었습니다.`:'이미 작성한 항목은 그대로 두었습니다.');});document.getElementById('saveShootPlan')?.addEventListener('click',()=>{state.shootPlans=state.shootPlans||{};state.shootPlans[p.id]={goal:document.getElementById('shootGoal').value,mood:document.getElementById('shootMood').value,light:document.getElementById('shootLight').value,shots:document.getElementById('shootShots').value,gear:document.getElementById('shootGear').value,staging:document.getElementById('shootStaging').value,planB:document.getElementById('shootPlanB').value,updatedAt:new Date().toISOString()};saveState();toast('촬영 계 function selectRepresentativePhoto(id,url,title,sourceUrl){const clean=safeUrl(url);if(!clean){toast('올바른 이미지 주소가 아닙니다.');return;}const p=placeById(id);if(!p)return;const previous=[...(p.imageCandidates||[])];if(!previous.some(x=>safeUrl(x.src||x.imageUrl)===clean))previous.unshift({title:title||`${p.name} 사진 후보`,imageUrl:clean,src:clean,sourcePageUrl:safeUrl(sourceUrl||''),sourceName:'사용자 선택 이미지',placeMatch:'unverified',status:'candidate',role:'user_candidate'});state.edits[id]={...p,selectedCoverImage:clean,selectedCoverTitle:title||`${p.name} 대표사진`,selectedCoverSourceUrl:safeUrl(sourceUrl||''),photoMatchStatus:'사용자 선택 · 장소 일치 재확인 필요',imageCandidates:previous.slice(0,30),photoHold:false};saveState();promoteRecentPlace(id);toast('대표사진을 변경했습니다. 장소 일치가 의심되면 다른 후보로 바꿔 주세요.');renderDetail(placeById(id));window.scrollTo(0,Math.max(0,document.getElementById('photoGallery')?.offsetTop-100||0));}

function renderMore(){view='more';currentId=null;document.getElementById('appContent').innerHTML=`<section class="section" style="margin-top:28px"><div class="section-head"><div><div class="eyebrow">MY PAGE / SETTINGS</div><h2>더보기</h2><p>앱 설정, 백업·복원, 장소 관리 및 사용자 매뉴얼입니다.</p></div></div><div class="more-grid"><article class="more-card"><div class="panel-kicker">PERSONAL ARCHIVE</div><h2>내 기록 관리</h2><p>즐겨찾기 ${state.favorites.length}곳 · 촬영 계획 ${Object.keys(state.shootPlans||{}).length}곳 · 메모 ${Object.values(state.notes).filter(x=>String(x).trim()).length}곳</p><div class="button-row"><button class="btn btn-primary" id="moreBackup">백업 다운로드</button><button class="btn btn-outline" id="moreRestore">백업 복원</button><input type="file" id="restoreFile" accept="application/json,.json" hidden></div></article><article class="more-card"><div class="panel-kicker">DISPLAY / ACCESSIBILITY</div><h2>화면 설정</h2><p>어두운 환경에서는 다크 모드를 사용할 수 있습니다. 설정은 이 브라우저에 저장됩니다.</p><div class="button-row"><button class="btn btn-outline" id="darkToggle">${state.darkMode?'☀ 밝은 화면으로':'◐ 다크 모드'}</button><button class="btn btn-outline" id="scrollTop">↑ 맨 위로</button></div></article><article class="more-card"><div class="panel-kicker">PLACE ADMINISTRATION</div><h2>장소 등록·수정</h2><p>새 장소 추가와 정보 수정은 관리자 모드에서만 가능합니다(관리자 암호 필요). 수정 내용은 이 기기에만 저장되며 온라인 게시 기능은 없습니다.</p><div class="button-row"><button class="btn btn-primary" id="moreEditMode">${editMode?'편집 모드 끄기':'편집 모드 켜기'}</button><button class="btn btn-outline" id="moreAddPlace">＋ 장소 추가</button></div></article><article class="more-card"><div class="panel-kicker">IMAGE ARCHIVE / SEPARATE MANIFEST</div><h2>사진과 출처 관리</h2><p>장소 기본정보와 이미지 출처 목록은 분리되어 있습니다. 장소 사진은 확인된 대체 주소를 차례로 시도하며, 실제 장소 사진 파일을 별도 중앙 보관소에 저장하는 기능은 아직 연결 단계가 아닙니다.</p><div class="more-stat-row"><div class="more-stat"><strong>${allPlaces().filter(p=>!!coverFor(p)).length}</strong><span>대표사진 주소 등록</span></div><div class="more-stat"><strong>${allPlaces().filter(p=>!hasDesignatedCover(p)).length}</strong><span>대 function openPlaceEditor(id){if(!editMode){toast('먼저 관리자 모드를 켜세요.');return;}const p=id?placeById(id):null;const vals=p||{name:'',region:'서울',category:'',address:'',summary:'',photoProfile:'',officialUrl:'',coverImage:'',mapSearchQuery:'',spaceTypes:['실내·외'],bestConcepts:[],shootingPermission:'촬영 전 담당처 확인 필요',openingStatus:'미확인',parking:'미확인',fee:'미확인'};const isNew=!p;document.getElementById('modalTitle').textContent=isNew?'새 장소 등록':'장소 정보 수정';document.getElementById('modalBody').innerHTML=`<form id="placeForm"><div class="form-grid"><div class="field"><label>장소명 *</label><input class="input" name="name" required value="${escapeHtml(vals.name)}"></div><div class="field"><label>지역 *</label><select class="select" name="region" required>${REGION_LIST.map(r=>`<option ${vals.region===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label>분류 / 공간 유형</label><input class="input" name="category" value="${escapeHtml(vals.category)}" placeholder="예: 산업건축·문화공간"></div><div class="field"><label>실내·외</label><select class="select" name="spaceType"><option ${((vals.spaceTypes||[]).join('').includes('실내'))?'selected':''}>실내</option><option ${((vals.spaceTypes||[]).join('').includes('실외'))?'selected':''}>실외</option><option>실내·외</option></select></div><div class="field full"><label>주소 / 지도 검색어</label><input class="input" name="address" value="${escapeHtml(vals.address||vals.mapSearchQuery||'')}"></div><div class="field full"><label>장소 설명</label><textarea class="textarea" name="summary">${escapeHtml(vals.summary||vals.photoProfile||'')}</textarea></div><div class="field full"><label>사진 URL (해당 장소와 맞는 사진만 등록)</label><input class="input" name="coverImage" type="url" value="${escapeHtml(vals.coverImage||'')}" placeholder="https://..."></div><div class="field full"><label>공식 홈페이지 / 출처 URL</label><input class="input" name="officialUrl" type="url" value="${escapeHtml(vals.officialUrl||'')}"></div><div class="field"><label>운영 시간</label><input class="input" name="openingStatus" value="${escapeHtml(vals.openingStatus||'미확인')}"></div><div class="field"><label>촬영 허가</label><input class="input" name="shootingPermission" value="${escapeHtml(vals.shootingPermission||'확인 필요')}"></div><div class="field"><label>주차·장비 하차</label><input class="input" name="parking" value="${escapeHtml(vals.parking||'미확인')}"></div><div class="field"><label>비용</label><input class="input" name="fee" value="${escapeHtml(vals.fee||'미확인')}"></div></div></form>`;document.getElementById('modalFooter').innerHTML=`${!isNew?`<button class="btn btn-outline" id="modalDelete">장소 삭제</button>`:'<span class="save-hint">새 장소는 이 기기에만 저장됩니다.</span>'}<div style="display:flex;gap:8px"><button class="btn btn-outline" id="modalCancel">취소</button><button class="btn btn-primary" id="modalSave">저장</button></div>`;document.getElementById('modalOverlay').classList.add('show');document.getElementById('modalClose').onclick=closeModal;document.getElementById('modalCancel').onclick=closeModal;document.getElementById('modalSave').onclick=()=>savePlaceForm(id);document.getElementById('modalDelete')?.addEventListener('click',()=>{closeModal();deletePlace(id);});}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show');}
function savePlaceForm(existingId){const form=document.getElementById('placeForm');if(!form.reportValidity())return;const fd=new FormData(form);const name=textval(fd.get('name'));if(!name){toast('장소명을 입력하세요.');return;}const id=existingId||`user-${Date.now().toString(36)}`;const old=existingId?placeById(existingId):null;const region=fd.get('region');const category=textval(fd.get('category'),'촬영 장소');const url=safeUrl(textval(fd.get('coverImage')));const official=safeUrl(textval(fd.get('officialUrl')));const next={...(old||{}),id,name,region,regionDetail:region,category,spaceTypes:[fd.get('spaceType')],summary:textval(fd.get('summary')),photoProfile:textval(fd.get('summary')),address:textval(fd.get('address')),mapSearchQuery:textval(fd.get('address')||`${region} ${name}`),officialUrl:official,coverImage:url,openingStatus:textval(fd.get('openingStatus'),'미확인'),shootingPermission:textval(fd.get('shootingPermission'),'확인 필요'),parking:textval(fd.get('parking'),'미확인'),fee:textval(fd.get('fee'),'미확인'),photoPotentialScore:null,photoMatchStatus:url?'참고 사진 후보 · 장소 일치 재확인 필요':'사진 검색 필요',imageRightsStatus:'미확인',imageCandidates:url?[{title:`${name} 참고 사진`,imageUrl:url,sourcePageUrl:official,sourceName:official?'사용자 입력 출처':'출처 미입력',creator:'',rights:'unknown',rightsLabel:'이용조건 확인 필요',placeMatch:'unverified',status:'candidate'}]:[],moodTags:old?.moodTags||[],bestConcepts:old?.bestConcepts||[],visualStrengths:old?.visualStrengths||[],constraints:old?.constraints||[],recommendedLenses:old?.recommendedLenses||[],compositionTips:old?.compositionTips||[],shootingPlan:old?.shootingPlan||{},officialSources:official?[{title:'공식 홈페이지',url:official}]:[],aliases:old?.aliases||[],searchTerms:[name,region,category,textval(fd.get('address'))].filter(Boolean),dataSource:old?.dataSource||'사용자 추가',sourceId:old?.sourceId||'',photoHold:false};if(existingId)state.edits[id]=next;else state.customPlaces.push({...next,createdAt:new Date().toISOString()});if(!existingId)promoteRecentPlace(id);saveState();closeModal();toast('장소 정보를 이 기기에 저장했습니다.');if(!existingId){lastListState={view:'home',scrollY:0};renderDetail(next);}else if(view==='detail')renderDetail(next);else if(view==='more')renderMore();else renderHome();}
function deletePlace(id){const p=placeById(id);if(!p||!confirm(`‘${p.name}’을 이 기기의 목록에서 삭제할까요? 원본 배포 데이터는 바뀌지 않습니다.`))return;state.deletedIds=[...new Set([...state.deletedIds,id])];state.customPlaces=state.customPlaces.filter(x=>x.id!==id);delete state.edits[id];saveState();toast('현재 기기의 목록에서 삭제했습니다.');renderHome();}
function exportBackup(){const payload={app:'FRAME_ATLAS_3',schemaVersion:3,exportedAt:new Date().toISOString(),favorites:state.favorites,notes:state.notes,checklists:state.checklists,shootPlans:state.shootPlans||{},customPlaces:state.customPlaces,edits:state.edits,deletedIds:state.deletedIds,darkMode:state.darkMode,imageReviews:state.imageReviews||{},recentPlaceIds:state.recentPlaceIds||[]};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});if(blob.size>10*1024*1024){toast('백업 파일이 10MB를 넘어 다운로드할 수 없습니다.');return;}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`FRAME_ATLAS_3_Backup_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('이 기기의 개인 기록을 백업했습니다. 사진 원본 파일과 공통 장소 DB는 별도 백업이 필요합니다.');}
function handleRestore(e){const file=e.target.files?.[0];if(!file)return;if(file.size>10*1024*1024){toast('백업 파일은 10MB 이하만 불러올 수 있습니다.');e.target.value='';return;}const reader=new FileReader();reader.onload=()=>{try{const o=JSON.parse(reader.result);if(o.app!=='FRAME_ATLAS_3'||o.schemaVersion!==3)throw new Error('지원하지 않는 백업 형식입니다. 현재 3.0 백업만 안전하게 복원할 수 있습니다.');if(!confirm('백업의 즐겨찾기·메모·체크리스트·로컬 장소 변경사항으로 현재 기기의 해당 개인 기록을 교체할까요?'))return;state={...state,favorites:Array.isArray(o.favorites)?o.favorites:[],notes:o.notes&&typeof o.notes==='object'?o.notes:{},checklists:o.checklists&&typeof o.checklists==='object'?o.checklists:{},shootPlans:o.shootPlans&&typeof o.shootPlans==='object'?o.shootPlans:{},customPlaces:Array.isArray(o.customPlaces)?o.customPlaces:[],edits:o.edits&&typeof o.edits==='object'?o.edits:{},deletedIds:Array.isArray(o.deletedIds)?o.deletedIds:[],darkMode:!!o.darkMode,imageReviews:o.imageReviews&&typeof o.imageReviews==='object'?o.imageReviews:{},recentPlaceIds:Array.isArray(o.recentPlaceIds)?o.recentPlaceIds:[]};saveState();document.body.classList.toggle('dark',state.darkMode);toast('백업을 복원했습니다.');if(view==='detail'&&currentId)renderDetail(placeById(currentId));else renderHome();}catch(err){toast(err.message||'백업 파일을 읽을 수 없습니다.');}finally{e.target.value='';}};reader.readAsText(file);}
function updateNavigation(){document.querySelectorAll('#appContent img[data-fallback-mode]').forEach(scheduleImageCheck);document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view||(view==='detail'&&b.dataset.view==='home')));document.getElementById('editModeBtn').textContent=editMode?'편집 모드 종료':'관리자 모드';const add=document.getElementById('addPlaceBtn');if(add)add.textContent='＋ 장소 추가';}
function routeTo(v){if(v==='search'){view='home';renderHome();setTimeout(()=>document.getElementById('placeSearch')?.focus(),80);document.getElementById('searchPanel')?.scrollIntoView({behavior:'smooth'});return;}if(v==='home')renderHome();else if(v==='favorites')renderFavorites();else if(v==='map')renderMap();else renderMore();window.scrollTo(0,0);}
function handleClick(e){if(e.target.closest('#floatingTop')){window.scrollTo({top:0,behavior:'smooth'});return;}if(e.target.closest('[data-search-link]'))return;const favbtn=e.target.closest('[data-fav]');if(favbtn){e.stopPropagation();toggleFavorite(favbtn.dataset.fav);return;}const open=e.target.closest('[data-open]');if(open){e.preventDefault();openDetail(open.dataset.open);return;}const cardEl=e.target.closest('[data-place]');if(cardEl){if(e.target.closest('button'))return;openDetail(cardEl.dataset.place);return;}}
document.addEventListener('click',handleClick);document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>routeTo(b.dataset.view)));document.getElementById('brandHome')?.addEventListener('click',e=>{e.preventDefault();routeTo('home');});document.getElementById('editModeBtn')?.addEventListener('click',toggleEditMode);document.getElementById('backupBtn')?.addEventListener('click',exportBackup);document.getElementById('addPlaceBtn')?.addEventListener('click',()=>{if(!editMode){toast('실제 장소를 추가하려면 관리자 모드를 먼저 켜세요.');return;}openPlaceEditor(null);});document.getElementById('modalClose')?.addEventListener('click',closeModal);document.getElementById('modalOverlay')?.addEventListener('click',e=>{if(e.target.id==='modalOverlay')closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-place]'))openDetail(e.target.dataset.place);});window.addEventListener('scroll',()=>{const b=document.querySelector('.detail-bottom-return');if(b)b.style.opacity=window.scrollY>80?'1':'0.85';});
document.body.classList.toggle('dark',state.darkMode);renderHome();
</script>
