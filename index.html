const IMAGE_RETRY_TOTAL_MS=8000;
const IMAGE_RETRY_ATTEMPT_MS=2400;
function scoutImageError(img){
 const now=Date.now(),started=Number(img.dataset.scoutStarted)||now;
 try{clearTimeout(Number(img.dataset.scoutTimer||0));}catch(e){}
 let tried=[];try{tried=JSON.parse(img.dataset.scoutTried||'[]')}catch(e){}
 if(img.src&&!tried.includes(img.src))tried.push(img.src);
 let candidates=[];try{candidates=JSON.parse(img.dataset.fallbackUrls||'[]')}catch(e){}
 const next=candidates.find(u=>u&&!tried.includes(u));img.dataset.scoutTried=JSON.stringify(tried);
 if(next&&now-started<IMAGE_RETRY_TOTAL_MS){img.dataset.fallbackUrls=JSON.stringify(candidates.filter(u=>u!==next));img.src=next;scoutImageWatch(img);return;}
 img.style.display='none';
 const parent=img.parentElement;
 const fallback=img.dataset.fallbackMode==='hero'?parent.querySelector('.hero-image-fallback'):img.nextElementSibling;
 if(fallback){
   fallback.style.display=['card','gallery','hero'].includes(img.dataset.fallbackMode)?'grid':'flex';
   if(img.dataset.fallbackMode==='recent'){fallback.textContent='사진 주소를 불러올 수 없습니다 · 상세 화면에서 대체 검색';fallback.classList.add('is-visible');}
   else {
     const strong=fallback.querySelector('strong');if(strong)strong.textContent='대표 이미지 주소에 접근할 수 없습니다.';
     const note=fallback.querySelector('.photo-fallback-note,[data-fallback-note],.detail-fallback-note');
     if(note)note.textContent='Google·네이버·Bing 검색 또는 출처 페이지에서 다른 사진을 확인하세요.';
     else {const span=fallback.querySelector('span');if(span)span.textContent='공식 출처 또는 장소명 검색으로 다른 사진을 확인하세요.';}
   }
 }
 const card=img.closest('.location-card');const tag=card?.querySelector('.photo-tag');if(tag)tag.textContent='사진 주소 실패 · 대체 검색 가능';

}
function scoutImageLoaded(img){clearTimeout(Number(img.dataset.scoutTimer||0));delete img.dataset.scoutTimer;delete img.dataset.scoutStarted;delete img.dataset.scoutTried;const fallback=img.dataset.fallbackMode==='hero'?img.parentElement.querySelector('.hero-image-fallback'):img.nextElementSibling;if(fallback){fallback.style.display='none';if(img.dataset.fallbackMode==='recent')fallback.classList.remove('is-visible');}if(img.dataset.fallbackMode==='hero')img.parentElement.classList.remove('hero-no-photo');}
function scoutImageWatch(img){if(img.complete&&img.naturalWidth>0){scoutImageLoaded(img);return;}clearTimeout(Number(img.dataset.scoutTimer||0));if(!img.dataset.scoutStarted)img.dataset.scoutStarted=String(Date.now());const elapsed=Date.now()-Number(img.dataset.scoutStarted);const remaining=IMAGE_RETRY_TOTAL_MS-elapsed;if(remaining<=0){scoutImageError(img);return;}img.dataset.scoutTimer=String(setTimeout(()=>{if(img.isConnected&&(!img.complete||img.naturalWidth===0))scoutImageError(img);},Math.min(IMAGE_RETRY_ATTEMPT_MS,remaining)));}
function scheduleImageCheck(img){if(img.loading==='lazy'&&'IntersectionObserver'in window){if(img.dataset.scoutObserved)return;img.dataset.scoutObserved='1';if(!imageLoadObserver)imageLoadObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){imageLoadObserver.unobserve(entry.target);delete entry.target.dataset.scoutObserved;scoutImageWatch(entry.target);}}),{rootMargin:'180px'});imageLoadObserver.observe(img);}else scoutImageWatch(img);}

<section class="panel" id="photoGallery"><div class="panel-kicker">04 / PHOTO REFERENCES</div><h2>대표·참고 사진 후보 <span class="candidate-count">${gallery.length}장 등록</span></h2><div class="candidate-place-context"><b>현재 장소</b> ${escapeHtml(p.name)} <span>· ${escapeHtml(p.regionDetail||p.region||'지역 미확인')} · ${escapeHtml(p.id)}</span></div><p>${escapeHtml(photoNote)}</p>${gallery.length===1?`<div class="cover-replacement-help"><strong>현재 후보 사진은 1장입니다.</strong> 이 사진을 지우지 않고 새 후보를 추가해 교체할 수 있습니다. 위의 이미지 검색에서 다른 사진을 찾은 뒤, 아래에 새 이미지 주소를 등록하고 새 카드의 <b>대표사진으로 사용</b>을 누르세요.</div>`:gallery.length===0?`<div class="cover-replacement-help"><strong>아직 등록된 사진 후보가 없습니다.</strong> 이미지 검색에서 장소에 맞는 사진을 찾아 아래에 주소를 등록하면 첫 대표사진으로 지정할 수 있습니다.</div>`:''}<div class="search-links"><button class="btn btn-primary btn-sm" data-imgsearch="naver">네이버 이미지</button><button class="btn btn-outline btn-sm" data-imgsearch="google">Google 이미지</button><button class="btn btn-outline btn-sm" data-imgsearch="bing">Bing 이미지</button>${p.officialUrl?`<a class="btn btn-outline btn-sm" href="${escapeHtml(safeUrl(p.officialUrl))}" target="_blank" rel="noopener">공식 출처 ↗</a>`:''}</div><div class="cover-add-box"><p><b>대표사진 교체 방법</b> 후보가 한 장뿐이어도 교체할 수 있습니다. 위의 Google·네이버·Bing 이미지 검색에서 새 사진을 열고 이미지 주소를 복사해 등록하세요. 새 후보가 아래에 나타나면 <b>대표사진으로 사용</b>을 누릅니다. 새 후보를 등록하는 것만으로는 기존 대표사진이 바뀌거나 삭제되지 않습니다.</p><div class="cover-add-grid"><div class="field full"><label for="candidateImageTitle">사진 이름(간단히)</label><input class="input" id="candidateImageTitle" placeholder="예: 북측 외관의 사선 구도"></div><div class="field full"><label for="candidateImageUrl">이미지 주소(URL)</label><input class="input" id="candidateImageUrl" placeholder="이미지 주소 복사 후 여기에 붙여넣기"></div><div class="field full"><label for="candidateSourceUrl">원문 페이지 주소(URL)</label><input class="input" id="candidateSourceUrl" placeholder="선택 사항 · 이미지가 게시된 원문 페이지"></div></div><div class="button-row"><button class="btn btn-primary btn-sm" id="addImageCandidate">사진 후보 등록</button><span class="save-hint">현재 브라우저에만 저장됩니다.</span></div></div>${gallery.length?`<div class="gallery-grid" style="margin-top:16px">${gallery.map((im,i)=>`<div class="gallery-item"><div class="gallery-img">${im.src?`<img loading="lazy" referrerpolicy="origin" src="${escapeHtml(im.src)}" data-fallback-mode="gallery" data-fallback-urls="${imageUrlData(p,im.src)}" alt="${escapeHtml(im.title)} · ${escapeHtml(p.name)} 사진 후보" onload="scoutImageLoaded(this)" onerror="scoutImageError(this)"><div class="gallery-img-fallback" style="display:none"><strong>사진 미리보기를 열 수 없습니다.</strong><span>원문 출처 또는 이미지 검색으로 확인하세요.</span></div>`:`<div class="gallery-img-fallback"><strong>사진 주소 없음</strong><span>장소명으로 이미지를 찾아보세요.</span></div>`}</div><div class="gallery-caption"><strong>${escapeHtml(im.title)}</strong><small class="gallery-place-context">${escapeHtml(p.name)} · ${escapeHtml(p.regionDetail||p.region||'지역 미확인')} · ${escapeHtml(p.id)}</small><p>${escapeHtml(im.sourceName||'출처 미상')} · ${im.placeMatch==='confirmed'?'장소 일치 후보':'장소 일치 확인 필요'}</p><details class="image-source-details"><summary>출처·참고 메모</summary><p>출처: ${escapeHtml(im.sourceName||'출처 미상')}</p><p>${escapeHtml(im.note||im.caption||'촬영 참고 이미지입니다. 장소와 현재 공간의 일치 여부를 확인해 주세요.')}</p></details>${im.sourcePageUrl?`<a href="${escapeHtml(safeUrl(im.sourcePageUrl))}" target="_blank" rel="noopener">원문 출처 열기 ↗</a>`:''}<button type="button" class="cover-select-btn ${coverFor(p)===im.src?'is-cover':''}" data-select-cover="${escapeHtml(im.src)}" data-cover-title="${escapeHtml(im.title||'참고 사진')}" data-cover-source="${escapeHtml(im.sourcePageUrl||'') }" ${coverFor(p)===im.src?'disabled':''}>${coverFor(p)===im.src?'현재 대표사진':'대표사진으로 사용'}</button></div></div>`).join('')}</div>`:`<div class="empty-state" style="margin-top:14px"><h3>등록된 사진 후보가 없습니다.</h3><p>위의 이미지 검색으로 장소 사진을 확인한 뒤, 아래 입력란에 이미지 주소를 등록하면 됩니다. 새 후보를 등록한 다음 대표사진으로 지정할 수 있습니다.</p></div>`}</section>
<section class="panel photo-review-panel"><div class="panel-kicker">05 / PHOTOGRAPHER IMAGE REVIEW</div><h2>대표사진의 예술적 가치 검토</h2>
<p>장소의 사진적 잠재력과 개별 사진의 완성도는 다릅니다. 실제 장소와 일치하는지, 선·형태·빛·재료가 잘 드러나는지, 대표 이미지로 쓸 만큼 공간이 식별되는지 별도로 평가합니다.</p>

<div class="review-form"><h3>현장 검토 결과 기록</h3><div class="form-grid"><div class="field"><label>장소 일치</label><select class="select" id="reviewMatch"><option ${savedReview.match==='미확인'?'selected':''}>미확인</option><option ${savedReview.match==='일치 확인'?'selected':''}>일치 확인</option><option ${savedReview.match==='불일치'?'selected':''}>불일치</option></select></div><div class="field"><label>대표사진 판단</label><select class="select" id="reviewDecision"><option ${savedReview.decision==='검토 대기'?'selected':''}>검토 대기</option><option ${savedReview.decision==='대표 후보'?'selected':''}>대표 후보</option><option ${savedReview.decision==='보조 참고'?'selected':''}>보조 참고</option><option ${savedReview.decision==='교체 필요'?'selected':''}>교체 필요</option></select></div><div class="field"><label>구도·형태 (1–5)</label><select class="select" id="reviewComposition">${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(savedReview.composition||0)===n?'selected':''}>${n} / 5</option>`).join('')}</select></div><div class="field"><label>빛·재료·색감 (1–5)</label><select class="select" id="reviewLight">${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(savedReview.light||0)===n?'selected':''}>${n} / 5</option>`).join('')}</select></div><div class="field"><label>촬영 활용도 (1–5)</label><select class="select" id="reviewUse">${[1,2,3,4,5].map(n=>`<option value="${n}" ${Number(savedReview.use||0)===n?'selected':''}>${n} / 5</option>`).join('')}</select></div><div class="field full"><label>검토 메모</label><textarea class="textarea" id="reviewMemo" placeholder="예: 간판이 잘려 장소 식별이 어렵다. 사광 시간대 외관 컷으로 교체 필요.">${escapeHtml(savedReview.memo||'')}</textarea></div></div><div class="memo-actions"><button class="btn btn-primary" id="saveImageReview">사진 검토 기록 저장</button><span class="save-hint">이 기기에 저장되며 JSON 백업에 포함됩니다.</span></div></div>

<section class="panel"><div class="panel-kicker">06 / FIELD CHECKLIST</div><h2>현장 촬영 체크리스트</h2><p>확인하지 않은 항목은 비워 두고, 현장 답사나 담당자 답변 후 기록하세요.</p><div id="checklistArea">${CHECKLIST_GROUPS.map((g,gi)=>`<div class="checklist-group"><h3><span class="tag">${String(gi+1).padStart(2,'0')}</span>${g.name}</h3>${g.items.map((it,i)=>{const key=`g${gi}i${i}`;const checked=!!(state.checklists[p.id]&&state.checklists[p.id][key]&&state.checklists[p.id][key].checked);const val=(state.checklists[p.id]&&state.checklists[p.id][key]&&state.checklists[p.id][key].note)||'';return `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><label class="check-row"><input type="checkbox" data-check-key="${key}" ${checked?'checked':''}> <span>${escapeHtml(it)}</span></label><input class="input" style="min-height:36px;margin-left:24px;width:calc(100% - 24px);font-size:11px" data-check-note="${key}" value="${escapeHtml(val)}" placeholder="확인 내용·담당자 답변·재확인 날짜"></div>`}).join('')}</div>`).join('')}</div><div class="memo-actions"><button class="btn btn-primary" id="saveChecklist">현장 체크리스트 저장</button><span class="save-hint">이 기기에 저장됩니다. 다른 기기와 자동 공유되지 않습니다.</span></div></section>

function exportBackup(){const payload={app:'FRAME_ATLAS_3',schemaVersion:3,exportedAt:new Date().toISOString(),favorites:state.favorites,notes:state.notes,checklists:state.checklists,shootPlans:state.shootPlans||{},customPlaces:state.customPlaces,edits:state.edits,deletedIds:state.deletedIds,darkMode:state.darkMode,imageReviews:state.imageReviews||{},recentPlaceIds:state.recentPlaceIds||[]};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});if(blob.size>10*1024*1024){toast('백업 파일이 10MB를 넘어 다운로드할 수 없습니다.');return;}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`FRAME_ATLAS_3_Backup_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('이 기기의 개인 기록을 백업했습니다. 사진 원본 파일과 공통 장소 DB는 별도 백업이 필요합니다.');}
function handleRestore(e){const file=e.target.files?.[0];if(!file)return;if(file.size>10*1024*1024){toast('백업 파일은 10MB 이하만 불러올 수 있습니다.');e.target.value='';return;}const reader=new FileReader();reader.onload=()=>{try{const o=JSON.parse(reader.result);if(o.app!=='FRAME_ATLAS_3'||o.schemaVersion!==3)throw new Error('지원하지 않는 백업 형식입니다. 현재 3.0 백업만 안전하게 복원할 수 있습니다.');if(!confirm('백업의 즐겨찾기·메모·체크리스트·로컬 장소 변경사항으로 현재 기기의 해당 개인 기록을 교체할까요?'))return;state={...state,favorites:Array.isArray(o.favorites)?o.favorites:[],notes:o.notes&&typeof o.notes==='object'?o.notes:{},checklists:o.checklists&&typeof o.checklists==='object'?o.checklists:{},shootPlans:o.shootPlans&&typeof o.shootPlans==='object'?o.shootPlans:{},customPlaces:Array.isArray(o.customPlaces)?o.customPlaces:[],edits:o.edits&&typeof o.edits==='object'?o.edits:{},deletedIds:Array.isArray(o.deletedIds)?o.deletedIds.filter(id=>!BASE_CATALOG_IDS.has(id)):[],darkMode:!!o.darkMode,imageReviews:o.imageReviews&&typeof o.imageReviews==='object'?o.imageReviews:{},recentPlaceIds:Array.isArray(o.recentPlaceIds)?o.recentPlaceIds:[]};saveState();document.body.classList.toggle('dark',state.darkMode);toast('백업을 복원했습니다.');if(view==='detail'&&currentId)renderDetail(placeById(currentId));else renderHome();}catch(err){toast(err.message||'백업 파일을 읽을 수 없습니다.');}finally{e.target.value='';}};reader.readAsText(file);}

document.addEventListener('click',function(e){const a=e.target.closest('a[href*="editorial-reference-gallery.html"]');if(!a)return;try{sessionStorage.setItem('faEditorialReturnContext',JSON.stringify({version:1,savedAt:Date.now(),view,currentId,lastListState,scrollY:window.scrollY,filters:{query,regionFilter,spaceFilter,moodFilter,imageFilter}}));}catch(_e){}},true);document.addEventListener('click',handleClick);document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>routeTo(b.dataset.view)));document.getElementById('brandHome')?.addEventListener('click',e=>{e.preventDefault();routeTo('home');});document.getElementById('editModeBtn')?.addEventListener('click',toggleEditMode);document.getElementById('backupBtn')?.addEventListener('click',()=>{(window.exportBackup||exportBackup)();});document.getElementById('addPlaceBtn')?.addEventListener('click',()=>{if(!editMode){toast('실제 장소를 추가하려면 관리자 모드를 먼저 켜세요.');return;}openPlaceEditor(null);});document.getElementById('modalClose')?.addEventListener('click',closeModal);document.getElementById('modalOverlay')?.addEventListener('click',e=>{if(e.target.id==='modalOverlay')closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-place]'))openDetail(e.target.dataset.place,e.target);});window.addEventListener('scroll',()=>{const b=document.querySelector('.detail-bottom-return');if(b)b.style.opacity=window.scrollY>80?'1':'0.85';});
function restoreAfterEditorialReturn(){const params=new URLSearchParams(location.search);if(params.get('faReturnEditorial')!=='1'){renderHome();return;}let ctx=null;try{ctx=JSON.parse(sessionStorage.getItem('faEditorialReturnContext')||'null');sessionStorage.removeItem('faEditorialReturnContext');}catch(_e){}if(!ctx||!ctx.savedAt||Date.now()-ctx.savedAt>60*60*1000){renderHome();return;}if(ctx.filters){query=ctx.filters.query||'';regionFilter=ctx.filters.regionFilter||'전체';spaceFilter=ctx.filters.spaceFilter||'전체';moodFilter=ctx.filters.moodFilter||'전체 분위기';imageFilter=ctx.filters.imageFilter||'전체';}lastListState=ctx.lastListState||lastListState;const restoreScroll=()=>requestAnimationFrame(()=>window.scrollTo(0,Number(ctx.scrollY)||0));if(ctx.view==='detail'&&ctx.currentId&&placeById(ctx.currentId)){currentId=ctx.currentId;view='detail';renderDetail(placeById(ctx.currentId));updateNavigation();restoreScroll();return;}if(ctx.view==='favorites')renderFavorites();else if(ctx.view==='map')renderMap();else if(ctx.view==='more')renderMore();else renderHome();restoreScroll();}document.body.classList.toggle('dark',state.darkMode);restoreAfterEditorialReturn();
