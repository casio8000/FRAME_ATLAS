const IMAGE_RETRY_TOTAL_MS=8000;
const IMAGE_RETRY_ATTEMPT_MS=2400;
function scoutImageError(img){
 const loadBadge=img.closest('.gallery-item')?.querySelector('[data-photo-load-status]');if(loadBadge)loadBadge.textContent='표시: 원본 URL 로드 실패';
 const now=Date.now(),started=Number(img.dataset.scoutStarted)||now;
 try{clearTimeout(Number(img.dataset.scoutTimer||0));}catch(e){}
 let tried=[];try{tried=JSON.parse(img.dataset.scoutTried||'[]')}catch(e){}
 if(img.src&&!tried.includes(img.src))tried.push(img.src);
 let candidates=[];try{candidates=JSON.parse(img.dataset.fallbackUrls||'[]')}catch(e){}
 const next=candidates.find(u=>u&&!tried.includes(u));img.dataset.scoutTried=JSON.stringify(tried);
 if(next&&now-started<IMAGE_RETRY_TOTAL_MS){img.dataset.fallbackUrls=JSON.stringify(candidates.filter(u=>u!==next));img.src=next;scoutImageWatch(img);return;}
 img.style.display='none';
 const parent=img.parentElement;
 const fallback=img.dataset.fallbackMode==='hero'?parent.querySelector('.hero-image-fallback'):img.nextElementSibling;
 if(fallback){
   fallback.style.display=['card','gallery','hero'].includes(img.dataset.fallbackMode)?'grid':'flex';
   if(img.dataset.fallbackMode==='recent'){fallback.textContent='사진 주소를 불러올 수 없습니다 · 상세 화면에서 대체 검색';fallback.classList.add('is-visible');}
   else {
     const strong=fallback.querySelector('strong');if(strong)strong.textContent='대표 이미지 주소에 접근할 수 없습니다.';
     const note=fallback.querySelector('.photo-fallback-note,[data-fallback-note],.detail-fallback-note');
     if(note)note.textContent='Google·네이버·Bing 검색 또는 출처 페이지에서 다른 사진을 확인하세요.';
     else {const span=fallback.querySelector('span');if(span)span.textContent='공식 출처 또는 장소명 검색으로 다른 사진을 확인하세요.';}
   }
 }
 const card=img.closest('.location-card');const tag=card?.querySelector('.photo-tag');if(tag)tag.textContent='사진 주소 실패 · 대체 검색 가능';
 if(img.dataset.fallbackMode==='hero')parent.classList.add('hero-no-photo');
}
function scoutImageLoaded(img){const loadBadge=img.closest('.gallery-item')?.querySelector('[data-photo-load-status]');if(loadBadge)loadBadge.textContent='표시: 현재 기기에서 로드됨';clearTimeout(Number(img.dataset.scoutTimer||0));delete img.dataset.scoutTimer;delete img.dataset.scoutStarted;delete img.dataset.scoutTried;const fallback=img.dataset.fallbackMode==='hero'?img.parentElement.querySelector('.hero-image-fallback'):img.nextElementSibling;if(fallback){fallback.style.display='none';if(img.dataset.fallbackMode==='recent')fallback.classList.remove('is-visible');}if(img.dataset.fallbackMode==='hero')img.parentElement.classList.remove('hero-no-photo');}
function scoutImageWatch(img){if(img.complete&&img.naturalWidth>0){scoutImageLoaded(img);return;}clearTimeout(Number(img.dataset.scoutTimer||0));if(!img.dataset.scoutStarted)img.dataset.scoutStarted=String(Date.now());const elapsed=Date.now()-Number(img.dataset.scoutStarted);const remaining=IMAGE_RETRY_TOTAL_MS-elapsed;if(remaining<=0){scoutImageError(img);return;}img.dataset.scoutTimer=String(setTimeout(()=>{if(img.isConnected&&(!img.complete||img.naturalWidth===0))scoutImageError(img);},Math.min(IMAGE_RETRY_ATTEMPT_MS,remaining)));}
function scheduleImageCheck(img){if(img.loading==='lazy'&&'IntersectionObserver'in window){if(img.dataset.scoutObserved)return;img.dataset.scoutObserved='1';if(!imageLoadObserver)imageLoadObserver=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){imageLoadObserver.unobserve(entry.target);delete entry.target.dataset.scoutObserved;scoutImageWatch(entry.target);}}),{rootMargin:'180px'});imageLoadObserver.observe(img);}else scoutImageWatch(img);}
function imageUrlData(p,current){return escapeHtml(JSON.stringify(imageUrlsFor(p).filter(u=>u!==current).slice(0,6)));}

  if(!mobile){if(typeof toast==='function')toast('티맵은 모바일 앱 길찾기 방식입니다. PC에서는 티맵 홈페이지를 열지 않습니다. PC에서는 네이버 지도, iPhone에서는 티맵 버튼을 이용해 주세요.');return;}

  if(routeWindow&&!routeWindow.closed)setTimeout(()=>{try{if(document.visibilityState==='visible'&&!routeWindow.closed&&(routeWindow.location.href==='about:blank'||routeWindow.location.href===''))showTmapRouteFallback(routeWindow,p,route,'티맵 앱이 자동으로 열리지 않았습니다. 아래 버튼을 한 번 더 눌러 주세요.');}catch(_e){}},1600);
  if(typeof toast==='function')toast(known.approx?'티맵 경로를 요청했습니다. 자동 추정 좌표이므로 실제 건물·진입점을 확인해 주세요.':'티맵 앱에 목적지 경로를 요청했습니다. 도착 지점을 확인해 주세요.');

 const search=buildNaverPcSearchUrl(p);if(!search)return;let win=null;try{win=window.open(search,'_blank');}catch(_e){}if(!win){if(typeof openExternal==='function')openExternal(search);if(typeof toast==='function')toast('네이버 지도 창이 차단되었습니다. 팝업 허용 여부를 확인해 주세요.');return;}if(!mobile){if(typeof toast==='function')toast('네이버 지도 검색을 열었습니다. 검색 결과에서 ‘길찾기’를 눌러 출발지를 현재 위치로 설정해 주세요.');return;}if(typeof toast==='function')toast('네이버 앱 경로를 준비합니다. 목적지 좌표가 확인되면 앱 길찾기를 요청합니다.');(async()=>{const dest=await resolveDestinationCoordinates(p);if(!dest){if(typeof toast==='function')toast('목적지 좌표를 찾지 못했습니다. 네이버 지도 검색에서 정확한 건물·입구를 선택해 주세요.');return;}const origin=await getCurrentLocationCoordinates();const route=buildNaverRouteUrl(p,dest,origin,String(location.origin||''));if(!route){if(typeof toast==='function')toast('네이버 앱 경로를 만들 수 없어 지도 검색을 유지합니다. 검색 결과에서 길찾기를 선택해 주세요.');return;}try{win.location.href=route;}catch(_e){}if(typeof toast==='function')toast(dest.approx?'네이버 앱 길찾기를 요청했습니다. 자동 추정 좌표이므로 건물·입구를 확인해 주세요.':'네이버 앱 길찾기를 요청했습니다. 도착 지점이 맞는지 확인해 주세요.');})();

function ioLabel(p){return {indoor:'실내',outdoor:'실외',both:'실내·외',unknown:''}[ioKind(p)];}
function localISODate(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

function isPlaceTemporarilyClosed(p){if(String(p?.operatingStatusCode||'').toLowerCase()!=='temporary-closed')return false;const until=String(p?.operatingStatusUntil||'').trim();return !until||localISODate()<=until;}

 <section class="panel" id="photoGallery"><div class="panel-kicker">03 / REPRESENTATIVE PHOTO CANDIDATES</div><h2>대표참고사진 후보 <span class="candidate-count">${gallery.length}장 등록</span></h2><p class="detail-fold-note">사진 설명은 장소·구도 중심으로 짧게 표시합니다. 전체 원문 제목과 출처·참고 메모는 카드 아래에서 펼쳐 확인하세요.</p><details class="detail-fold detail-fixed-open" id="photoCandidateDetails" open><summary><span>대표사진 후보 · 이미지 관리</span><span class="detail-fold-meta">${gallery.length}장 · 추가 / 출처 / 대표 지정</span></summary><div class="detail-fold-body"><div class="candidate-place-context"><b>현재 장소</b> ${escapeHtml(p.name)} <span>· ${escapeHtml(p.regionDetail||p.region||'지역 미확인')} · ${escapeHtml(p.id)}</span></div><p>${escapeHtml(editorialBrief(photoNote,72))}</p>${gallery.length===1?`<div class="cover-replacement-help"><strong>현재 후보 사진은 1장입니다.</strong> 이 사진을 지우지 않고 새 후보를 추가해 교체할 수 있습니다. 위의 이미지 검색에서 다른 사진을 찾은 뒤, 아래에 새 이미지 주소를 등록하고 새 카드의 <b>대표사진으로 사용</b>을 누르세요.</div>`:gallery.length===0?`<div class="cover-replacement-help"><strong>아직 등록된 사진 후보가 없습니다.</strong> 이미지 검색에서 장소에 맞는 사진을 찾아 아래에 주소를 등록하면 첫 대표사진으로 지정할 수 있습니다.</div>`:''}<div class="search-links"><button class="btn btn-primary btn-sm" data-imgsearch="naver">네이버 이미지</button><button class="btn btn-outline btn-sm" data-imgsearch="google">Google 이미지</button><button class="btn btn-outline btn-sm" data-imgsearch="bing">Bing 이미지</button>${p.officialUrl?`<a class="btn btn-outline btn-sm" href="${escapeHtml(safeUrl(p.officialUrl))}" target="_blank" rel="noopener">공식 출처 ↗</a>`:''}</div><div class="cover-add-box"><p><b>이미지 후보 최대 3장 한꺼번에 등록</b> Google·네이버·Bing 이미지 검색이나 사진이 여러 장 있는 원문 페이지를 열고, 등록할 사진을 하나씩 열어 <b>이미지 주소(URL)</b>를 복사하세요. 아래 1~3번 칸에 붙여넣으면 한 번에 후보로 추가됩니다. 현재 대표사진은 삭제되지 않습니다. 새 사진을 대표로 지정하면 기존 사진은 후보 목록에 남아 다시 선택할 수 있습니다.</p><div class="notice" style="margin:10px 0;font-size:11px">외부 검색 사이트의 사진 목록을 앱이 자동으로 읽을 수는 없습니다(브라우저 보안 제한). 검색 페이지에서 직접 선택한 이미지 URL 3개와 해당 원문 페이지 주소를 아래에 넣어 주세요. 사진 파일의 재사용 권한은 별도로 확인해야 합니다.</div><div class="cover-add-grid"><div class="fie ry-caption"><strong class="candidate-short-caption" title="${escapeHtml(im.title||im.caption||'참고 사진')}">${escapeHtml(candidateDescriptionSummary(im,p,8))}</strong><small class="gallery-place-context">${escapeHtml(p.regionDetail||p.region||'지역 미확인')} · ${escapeHtml(p.id)}</small>${photoStatusStrip(im,p)}<details class="image-source-details"><summary>전체 설명·출처 확인</summary><p>원문 제목: ${escapeHtml(im.title||'제목 미상')}</p><p>출처: ${escapeHtml(im.sourceName||'출처 미상')}</p><p>장소 일치: ${escapeHtml(photoMatchStatusLabel(im))}</p><p>사진 이용 권리: ${escapeHtml(photoRightsStatusLabel(im))}</p><p>사진 역할: ${escapeHtml(photoRoleStatusLabel(im,p))}</p><p>${escapeHtml(im.note||im.caption||im.description||'촬영 참고 이미지입니다. 장소와 현재 공간의 일치 여부를 확인해 주세요.')}</p></details>${im.sourcePageUrl?`<a href="${escapeHtml(safeUrl(im.sourcePageUrl))}" target="_blank" rel="noopener">원문 출처 열기 ↗</a>`:''}<button type="button" class="cover-select-btn ${coverFor(p)===im.src?'is-cover':''}" data-select-cover="${escapeHtml(im.src)}" data-cover-title="${escapeHtml(im.title||'참고 사진')}" data-cover-source="${escapeHtml(im.sourcePageUrl||'') }" ${coverFor(p)===im.src?'disabled':''}>${coverFor(p)===im.src?'현재 대표사진':'대표사진으로 사용'}</button></div></div>`).join('')}</div>`:`<div class="empty-state" style="margin-top:14px"><h3>등록된 사진 후보가 없습니다.</h3><p>위의 이미지 검색으로 장소 사진을 확인한 뒤, 아래 입력란에 이미지 주소를 등록하면 됩니다. 새 후보를 등록한 다음 대표사진으로 지정할 수 있습니다.</p></div>`}</div></details></section> <section class="panel place-review-panel" id="placeReviewPanel"><div class="panel-kicker">04 / PLACE SELECTION REVIEW</div><h2>장소의 예술적 가치·촬영 적합성 검토 <span class="detail-review-state">${hasUserPlaceReview?'내 장소 평가 기록 있음':'아직 평가하지 않음'}</span></h2><p>사진 한 장의 미적 완성도가 아니라, 이 장소를 패션·아이돌·배우 촬영 후보로 선택할 가치가 있는지 판단합니다. 공간 전체의 독창성, 빛과 재료, 인물·의상 촬영 잠재력, 실제 현장 조건을 직접 평가합니다.</p>${hasUserPlaceReview?`<div class="notice review-note"><b>내가 저장한 장소 평가</b><br>공간의 독창성 ${savedPlaceReview.uniqueness??'미평가'}/5 · 빛·재료·색감 ${savedPlaceReview.lightMaterial??'미평가'}/5 · 인물 촬영 잠재력 ${savedPlaceReview.shootPotential??'미평가'}/5 · 현장 실현 가능성 ${savedPlaceReview.feasibility??'미평가'}/5<br><b>선정 판단:</b> ${escapeHtml(savedPlaceReview.decision||'미설정')}<br><small>검토일: ${escapeHtml(String(savedPlaceReview.updatedAt||'').slice(0,10)||'기록 없음')} · 사용자 직접 입력</small></div>`:`<div class="notice">장소 정보나 사진 후보가 있다는 이유만으로 높은 점수를 부여하지 않습니다. 실제 촬영 목적과 현장 조건을 고려해 직접 평가하세요.</div>`}<details class="detail-fold" id="placeReviewDetails"><summary><span>평가 기준과 직접 입력 열기</span><span class="detail-fold-meta">선정 판단 · 4개 항목 1~5점</span></summary><div class="detail-fold-body"><details class="score-rubric"><summary>1~5점 평가 기준 보기</summary><div class="detail-score-rubric-grid place-score-rubric-grid"><div class="rubric-item"><b>공간의 독창성</b><p><strong>1</strong> 시각적 특징이 약하고 대체 장소가 많음</p><p><strong>2</strong> 일부 특징은 있으나 인상적인 구성이 제한됨</p><p><strong>3</strong> 공간 성격이 읽히고 목적에 맞는 구성이 가능함</p><p><strong>4</strong> 뚜렷한 조형·패턴·깊이로 차별화된 컷을 만들 수 있음</p><p><strong>5</strong> 장소 고유의 강한 시각적 정체성이 촬영 콘셉트를 이끌 수 있음</p></div><div class="rubric-item"><b>빛·재료·색감</b><p><strong>1</strong> 빛·재료 표현이 단조롭거나 통제가 어려움</p><p><strong>2</strong> 질감·색·빛을 활용할 범위가 좁음</p><p><strong>3</strong> 시간대·날씨·보정에 따라 활용 가능함</p><p><strong>4</strong> 자연광·반사·그림자·재료 질감을 의도적으로 활용할 수 있음</p><p><strong>5</strong> 빛과 재료가 장소만의 강한 분위기와 화면을 형성함</p></div><div class="rubric-item"><b>인물·의상 촬영 잠재력</b><p><strong>1</strong> 인물 배치와 의상 표현에 큰 제약이 예상됨</p><p><strong>2</strong> 특정 구도나 컷에만 제한적으로 사용할 수 있음</p><p><strong>3</strong> 기본 인물·전신·디테일 컷을 구성할 수 있음</p><p><strong>4</strong> 인물 위치·렌즈·거리 변화를 통해 다양한 컷을 만들 수 있음</p><p><strong>5</strong> 공간과 인물·의상 실루엣의 관계가 독창적인 화보로 발전할 수 있음</p></div><div class="rubric-item"><b>현장 실현 가능성</b><p><strong>1</strong> 접근·허가·비용 조건이 촬영 목적에 크게 맞지 않음</p><p><strong>2</strong> 주요 제약이 많아 실행 부담이 큼</p><p><strong>3</strong> 조건이 미확인 또는 일부 조정이 필요함</p><p><strong>4</strong> 예상 조건은 관리 가능하나 최신 운영·허가 확인이 필요함</p><p><strong>5</strong> 촬영 목적에 필요한 접근·허가·비용 조건을 직접 확인해 실행 가능성이 높음</p></div></div><p class="compact-section-footnote">평가 점수는 사용자의 장소 선정 판단입니다. 운영처의 촬영 허가, 현재 운영 여부, 사 function selectRepresentativePhoto(id,url,title,sourceUrl){
 const clean=safeUrl(url);if(!clean){toast('올바른 이미지 주소가 아닙니다.');return;}
 if(isLikelyImagePage(clean)){toast('이 주소는 이미지 파일이 아니라 원문 페이지로 보입니다. 원문에서 이미지 주소를 복사해 등록해 주세요.');return;}
 const p=placeById(id);if(!p)return;
 const displayTitle=(title||`${p.name} 대표사진`).trim();const srcPage=safeUrl(sourceUrl||'');
 const previous=[...(p.imageCandidates||[])];let found=false;
 const normalized=previous.map(x=>{const u=safeUrl(x.src||x.imageUrl||'');if(u===clean){found=true;return {...x,title:displayTitle,src:clean,imageUrl:clean,sourcePageUrl:srcPage||x.sourcePageUrl||'',sourceName:'사용자 선택 · 현재 대표사진',role:'selected_cover',status:'selected'};}if(x.role==='selected_cover')return {...x,role:'user_candidate',status:'candidate'};return x;});
 if(!found)normalized.unshift({title:displayTitle,imageUrl:clean,src:clean,sourcePageUrl:srcPage,sourceName:'사용자 선택 · 현재 대표사진',placeMatch:'unverified',status:'selected',role:'selected_cover'});
 state.edits[id]={...p,coverImage:clean,selectedCoverImage:clean,userSelectedCover:clean,selectedCoverTitle:displayTitle,selectedCoverSourceUrl:srcPage,photoSourceUrl:srcPage,photoMatchStatus:'사용자 선택 · 대표사진 확정 · 장소 일치/네트워크 별도 확인',imageCandidates:normalized.slice(0,80),photoHold:false};
 markRecentPlace(id);if(!saveState())return;currentId=id;
 /* Update the currently visible gallery synchronously so the click has immediate visual feedback. */
 const updateVisibleGallery=()=>{const grid=document.querySelector('#photoGallery .gallery-grid');if(!grid)return;let chosen=null;grid.querySelectorAll('.gallery-item').forEach(card=>{const b=card.querySelector('[data-select-cover]');if(!b)return;const is=safeUrl(b.dataset.selectCover)===clean;b.classList.toggle('is-current-representative',is);b.classList.toggle('is-cover',is);b.disabled=is;b.textContent=is?'현재 대표사진':'대표사진으로 사용';if(is){chosen=card;const h=card.querySelector('.gallery-caption strong');if(h){h.textContent=candidateDescriptionSummary({title:displayTitle},allPlaces().find(x=>x.id===id)||p,8);h.title=displayTitle;}}});if(chosen&&grid.firstElementChild!==chosen)grid.insertBefore(chosen,grid.firstElementChild);};
 updateVisibleGallery();
 try{renderDetail(placeById(id));}catch(err){console.error('대표사진 화면 갱신 실패',err);}

 if(typeof window.requestAnimationFrame==='function')window.requestAnimationFrame(finish);else setTimeout(finish,0);
 toast('대표사진을 확정하고 저장했습니다. 후보사진 화면의 왼쪽 상단에 현재 대표사진으로 표시됩니다.');
}
function addImageCandidate(id){
 const p=placeById(id);if(!p)return;
 const sourceRaw=String(document.getElementById('candidateSourceUrl')?.value||'').trim(),sourceUrl=safeUrl(sourceRaw);
 if(sourceRaw&&!sourceUrl){toast('원문 페이지 주소가 올바르지 않습니다. http:// 또는 https:// 주소를 확인해 주세요.');return;}
 const slots=[
  {url:document.getElementById('candidateImageUrl')?.value||'',title:document.getElementById('candidateImageTitle')?.value||''},
  {url:document.getElementById('candidateImageUrl2')?.value||'',title:document.getElementById('candidateImageTitle2')?.value||''},
  {url:document.getElementById('candidateImageUrl3')?.value||'',title:document.getElementById('candidateImageTitle3')?.value||''}
 ];
 const typed=slots.map((x,index)=>({...x,slot:index+1})).filter(x=>String(x.url||'').trim());
 if(!typed.length){toast('이미지 주소를 최소 1개 입력해 주세요.');document.getElementById('candidateImageUrl')?.focus();return;}
 const fresh=[],batchSeen=new Set(),existing=new Set([...(p.imageCandidates||[]).map(x=>safeUrl(x.src||x.imageUrl||'')),p.coverImage,p.selectedCoverImage,p.userSelectedCover].map(x=>safeUrl(x)).filter(Boolean));
 for(let i=0;i<typed.length;i++){
  const raw=String(typed[i].url||'').trim(),url=safeUrl(raw);
  if(!url){toast('사진 '+typed[i].slot+'의 URL이 올바르지 않습니다. http:// 또는 https:// 주소를 확인해 주세요.');return;}
  if(isLikelyImagePage(url)){toast('사진 '+typed[i].slot+' 주소가 이미지 파일이 아니라 원문 페이지로 보입니다. 페이지 안에서 실제 이미지 주소를 복사해 주세요.');return;}
  if(batchSeen.has(url)||existing.has(url))continue;
  batchSeen.add(url);
  const title=String(typed[i].title||'').trim();
  fresh.push({title:title||`${p.name} 사진 후보 ${fresh.length+1}`,imageUrl:url,src:url,sourcePageUrl:sourceUrl,sourceName:sourceUrl?'사용자 추가 · 원문 연결':'사용자 추가 · 출처 미입력',creator:'',rights:'unknown',rightsLabel:'재사용 조건 미확인',placeMatch:'unverified',status:'candidate',role:'user_candidate',note:'사용자가 웹검색에서 직접 선택한 이미지 후보. 장소 일치와 재사용 조건을 추가 확인해야 함.'});
 }
 if(!fresh.length){toast('새 후보가 없습니다. 입력한 주소가 기존 후보와 중복인지 확인해 주세요.');return;}
 const candidates=[...fresh,...(p.imageCandidates||[])],seen=new Set(),merged=[];
 for(const item of candidates){const u=safeUrl(item.src||item.imageUrl||'');if(!u||seen.has(u))continue;seen.add(u);merged.push({...item,src:u,imageUrl:u});}
 state.edits[id]={...p,imageCandidates:merged.slice(0,80),photoMatchStatus:`사진 후보 ${fresh.length}장 추가 · 장소 일치/재사용 조건 확인 필요`};
 markRecentPlace(id);if(!saveState())return;
 toast(`${fresh.length}장 사진 후보를 저장했습니다. 현재 대표사진은 그대로 유지됩니다.`);renderDetail(placeById(id));const fold=document.getElementById('photoCandidateDetails');if(fold)fold.open=true;document.getElementById('photoGallery')?.scrollIntoView({behavior:'smooth'});
}
