name: FRAME ATLAS quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate data and app shell
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check V2 application JavaScript syntax
        run: node --check v2/assets/app.js

      - name: Install Playwright for real-browser UI checks
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium for real-browser UI checks
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile V2 smoke test
        run: |
          mkdir -p test-results
          node tests/v2-browser-smoke.cjs
      - name: Upload V2 browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frame-atlas-v2-browser-smoke
          path: test-results/*.png
          if-no-files-found: ignore

      - name: Validate location data
        run: python tools/validate.py

      - name: Ensure validation report matches current data
        run: git diff --exit-code -- tools/report.md

      - name: Check app syntax, resources, version and photo import
        run: python tools/check_app.py

      - name: Test safe backup merge rules
        run: node tools/test_backup_merge.js

      - name: Test per-device sync safety rules
        run: node tools/test_device_sync.js

      - name: Test legacy V6 audit summary
        run: node --test tests/legacy-v6-audit.test.js
